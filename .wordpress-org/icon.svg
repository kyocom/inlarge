<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6B6B"/>
      <stop offset="1" stop-color="#6C5CE7"/>
    </linearGradient>
    <clipPath id="ph">
      <rect x="64" y="80" width="200" height="150" rx="18"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#g)"/>

  <!-- photo: solid white plate, glyph knocked out to the background gradient -->
  <rect x="64" y="80" width="200" height="150" rx="18" fill="#FFFFFF"/>
  <g clip-path="url(#ph)">
    <circle cx="221" cy="121" r="15" fill="url(#g)"/>
    <path d="M80 232 L134 152 L167 191 L193 161 L246 232 Z" fill="url(#g)"/>
  </g>

  <!-- expand: corner brackets joined by a diagonal -->
  <g fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="300,148 300,110 338,110"/>
    <polyline points="440,212 440,250 402,250"/>
    <line x1="300" y1="110" x2="440" y2="250"/>
  </g>

  <!-- article text stays readable -->
  <g fill="#FFFFFF" fill-opacity="0.55">
    <rect x="64" y="286" width="384" height="22" rx="11"/>
    <rect x="64" y="330" width="384" height="22" rx="11"/>
    <rect x="64" y="374" width="384" height="22" rx="11"/>
    <rect x="64" y="418" width="268" height="22" rx="11"/>
  </g>
</svg>
